name: 排程補跑監控

# GitHub Actions 的 cron 排程在平台負載高時可能延遲甚至整次跳過（官方已知限制，
# 尤其整點/偶數小時最容易撞上全球排隊尖峰）。這支workflow每20分鐘檢查一次
# 其他4個排程各自「上次成功執行距今多久」，超過各自允許的最大間隔就用
# workflow_dispatch補觸發，把誤點時間壓在20分鐘內，不用去猜GitHub什麼時候會delay。

on:
  schedule:
    - cron: '7,27,37,47 * * * *'   # 錯開整點/半點，避免自己也撞上GitHub排隊尖峰；多加:37是為了讓
                                    # update-financial-data(預期每小時:17觸發)能在逾期20分鐘內被抓到
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  watchdog:
    runs-on: ubuntu-latest
    steps:
      - name: 檢查各排程是否逾期，逾期就補觸發
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          check_and_trigger() {
            local file="$1"
            local max_age_hours="$2"
            local last_run
            last_run=$(gh api "repos/$REPO/actions/workflows/$file/runs?per_page=1&status=completed" \
              --jq '.workflow_runs[0].created_at' 2>/dev/null)

            if [ -z "$last_run" ] || [ "$last_run" = "null" ]; then
              echo "⚠️ $file 查無執行紀錄，略過"
              return
            fi

            local last_ts now_ts age_hours
            last_ts=$(date -d "$last_run" +%s)
            now_ts=$(date +%s)
            age_hours=$(( (now_ts - last_ts) / 3600 ))
            echo "$file：上次執行 $last_run（$age_hours 小時前，門檻 $max_age_hours 小時）"

            if [ "$age_hours" -ge "$max_age_hours" ]; then
              echo "🔁 $file 已逾期，觸發補跑"
              gh workflow run "$file" --repo "$REPO"
            fi
          }

          # update-financial-data.yml 是每小時排程(cron '17 1-23 * * *')，用「距上次執行幾小時」
          # 這種粗粒度門檻抓不到「這次:17沒觸發」，逾期要等滿3小時才補，太鬆。改用「本UTC小時的
          # 預期觸發時間(HH:17)過了20分鐘寬限、且這小時內查無任何執行紀錄」才補跑，且天然只會補一次
          # （一補上就會查到本小時的紀錄），不會跟延遲到達的原生排程疊加超過FinMind每小時額度。
          check_hourly_financial_catchup() {
            local file="update-financial-data.yml"
            local cur_hour cur_min now_ts expected_ts due_ts recent
            cur_hour=$(date -u +%H)
            cur_min=$(date -u +%M)

            if [ "$cur_hour" = "00" ]; then
              echo "$file：UTC 0點排程本身就跳過，不檢查"
              return
            fi

            now_ts=$(date -u +%s)
            expected_ts=$(date -u -d "$(date -u +%Y-%m-%d) ${cur_hour}:17:00" +%s)
            due_ts=$(( expected_ts + 20*60 ))

            if [ "$now_ts" -lt "$due_ts" ]; then
              echo "$file：本小時(UTC ${cur_hour}:17)預期觸發時間+20分鐘寬限未到，略過"
              return
            fi

            recent=$(gh api "repos/$REPO/actions/workflows/$file/runs?per_page=5" \
              --jq '.workflow_runs[] | select(.created_at >= "'"$(date -u -d "$(date -u +%Y-%m-%d) ${cur_hour}:00:00" +%Y-%m-%dT%H:%M:%SZ)"'") | .created_at' 2>/dev/null)

            if [ -n "$recent" ]; then
              echo "$file：本小時已有執行紀錄，略過"
              return
            fi

            echo "🔁 $file 本小時(UTC ${cur_hour}:17)逾20分鐘未觸發，補跑"
            gh workflow run "$file" --repo "$REPO"
          }

          # daily-report-update.yml 現在一天4次，對應各市場收盤後1小時：
          # 06:33 UTC(台股收盤+1h)、11:03 UTC(全亞股收盤+1h)、21:37 UTC(美股收盤+1h)、
          # 22:41 UTC(美股收盤+2h備援)。這個 windows 陣列是事實來源的複製，改
          # daily-report-update.yml 的 cron 務必同步改這裡，否則時窗判斷會跟實際排程對不上。
          #
          # 原本(改4次前)用「距上次執行14小時」粗粒度門檻，會被白天的手動/補跑重置時鐘騙到。
          # 改用精準時窗：把一天切成4個時窗(每個時窗 = 從該次排程時間到下一次排程時間之間)，
          # 每次 watchdog 執行時只判斷「現在落在哪個時窗」，該時窗的預期觸發時間+20分寬限已過、
          # 且時窗內查無執行紀錄，才補跑；一天最多對每個時窗各補一次(一補上就查到本輪紀錄)。
          check_daily_report_catchup() {
            local file="daily-report-update.yml"
            local windows=("06:33|台股收盤+1h" "11:03|全亞股收盤+1h" "21:37|美股收盤+1h" "22:41|美股收盤+2h")
            local n=${#windows[@]}
            local now_ts today first_hhmm first_today_ts base_date
            now_ts=$(date -u +%s)
            today=$(date -u +%Y-%m-%d)
            first_hhmm="${windows[0]%%|*}"
            first_today_ts=$(date -u -d "$today ${first_hhmm}:00" +%s)

            if [ "$now_ts" -lt "$first_today_ts" ]; then
              # 現在早於今天第一個時窗，代表仍處於「昨天最後一個時窗」的延續區間
              base_date=$(date -u -d 'yesterday' +%Y-%m-%d)
            else
              base_date="$today"
            fi

            local i
            for i in "${!windows[@]}"; do
              local hhmm="${windows[$i]%%|*}"
              local label="${windows[$i]#*|}"
              local start_ts due_ts end_ts
              start_ts=$(date -u -d "$base_date ${hhmm}:00" +%s)
              due_ts=$(( start_ts + 20*60 ))

              if [ $((i+1)) -lt "$n" ]; then
                local next_hhmm="${windows[$((i+1))]%%|*}"
                end_ts=$(date -u -d "$base_date ${next_hhmm}:00" +%s)
              else
                local next_date
                next_date=$(date -u -d "$base_date + 1 day" +%Y-%m-%d)
                end_ts=$(date -u -d "$next_date ${first_hhmm}:00" +%s)
              fi

              if [ "$now_ts" -ge "$due_ts" ] && [ "$now_ts" -lt "$end_ts" ]; then
                local start_iso recent
                start_iso=$(date -u -d "@$start_ts" +%Y-%m-%dT%H:%M:%SZ)
                # 不加status過濾：queued/in_progress也算，避免補跑跟延遲到達的原生排程疊加
                recent=$(gh api "repos/$REPO/actions/workflows/$file/runs?per_page=10" \
                  --jq '.workflow_runs[] | select(.created_at >= "'"$start_iso"'") | .created_at' 2>/dev/null)

                if [ -n "$recent" ]; then
                  echo "$file：[$label]時窗($start_iso 起)已有執行紀錄，略過"
                else
                  echo "🔁 $file：[$label]時窗($start_iso 起)查無執行紀錄，補跑"
                  gh workflow run "$file" --repo "$REPO"
                fi
                return
              fi
            done
            echo "$file：目前不在任何時窗的寬限期內，略過"
          }

          # 門檻需對齊各排程實際cron頻率，2026-07-22排程對調(auto-expand改1天1次、
          # update-financial-data改每小時1次)後這裡曾忘記同步更新，導致
          # auto-expand用舊的3小時門檻誤判「逾期」而被重複補跑、白耗FinMind額度。
          check_and_trigger "auto-expand-stocks.yml" 26
          check_hourly_financial_catchup
          check_daily_report_catchup
          check_and_trigger "mops_crawler.yml" 192
