name: Daily Financial Report Update

on:
  schedule:
    # 一天4次，對應各市場收盤後1小時（分鐘皆錯開避免整點排隊延遲）。
    # 這4個時間點是 schedule-watchdog.yml 的 check_daily_report_catchup() 補跑邏輯的
    # 事實來源，改這裡務必同步改該函式的 windows 陣列，否則時窗判斷會跟實際排程對不上。
    - cron: '33 6 * * *'    # 台北 14:33（台股收盤 13:30 後1hr）
    - cron: '3 11 * * *'    # 台北 19:03（全亞股收盤後1hr，含印度SENSEX/NIFTY 15:30 IST最晚收盤）
    - cron: '37 21 * * *'   # 台北 05:37（美股收盤後1hr = 最早可拿到當日美股收盤）
    - cron: '41 22 * * *'   # 台北 06:41（美股收盤後2hr，亞股開盤前備援）
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

jobs:
  update-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance pytz

      - name: Fetch market indices
        run: python fetch-market-data.py

      - name: Generate market analysis
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python generate-market-analysis.py

      - name: Cool down Gemini quota before news-highlights
        run: sleep 60

      - name: Generate news and highlights
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python generate-news-highlights.py

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Update daily report
        run: node update-daily-report.js

      - name: Update risk dashboard
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python fetch-risk-dashboard.py

      - name: Push via GitHub API
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: main
        run: |
          CURRENT_SHA=$(git rev-parse HEAD:daily-report.json 2>/dev/null || echo "")
          if [ -z "$CURRENT_SHA" ]; then
            echo "❌ 無法獲取 SHA"
            exit 1
          fi

          NEW_CONTENT=$(base64 -w 0 daily-report.json)

          RESPONSE=$(curl -s -X PUT \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/$REPO/contents/daily-report.json" \
            -d "{
              \"message\": \"🔄 自動更新: $(date -u +'%Y-%m-%d %H:%M:%S UTC')\",
              \"content\": \"$NEW_CONTENT\",
              \"branch\": \"$BRANCH\",
              \"sha\": \"$CURRENT_SHA\",
              \"committer\": {
                \"name\": \"github-actions[bot]\",
                \"email\": \"github-actions[bot]@users.noreply.github.com\"
              }
            }")

          echo "$RESPONSE" | python3 -c "import json,sys; r=json.load(sys.stdin); print('✅ 已更新:', r.get('content',{}).get('sha','?')[:8])" 2>/dev/null || echo "$RESPONSE"
