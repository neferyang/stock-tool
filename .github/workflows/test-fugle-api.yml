name: 測試 Fugle 富果行情 API

# 僅手動觸發，用來驗證 FUGLE_API_KEY 格式與 Market Data API 的正確呼叫方式。
# 不印出 Key 明文，只印 HTTP 狀態碼與回應內容（公開報價資料，無隱私疑慮）。
# 驗證通過後這支 workflow 會被移除或改寫成正式整合。

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 呼叫 Fugle Market Data API（X-API-KEY header）
        env:
          FUGLE_API_KEY: ${{ secrets.FUGLE_API_KEY }}
        run: |
          if [ -z "$FUGLE_API_KEY" ]; then
            echo "❌ FUGLE_API_KEY 未設定，請先在 repo Secrets 新增"
            exit 1
          fi
          echo "=== 測試 1：X-API-KEY header ==="
          curl -sS -w "\nHTTP_STATUS:%{http_code}\n" \
            -H "X-API-KEY: $FUGLE_API_KEY" \
            "https://api.fugle.tw/marketdata/v1.0/stock/intraday/quote/2330"

          echo ""
          echo "=== 測試 2：Authorization Bearer ==="
          curl -sS -w "\nHTTP_STATUS:%{http_code}\n" \
            -H "Authorization: Bearer $FUGLE_API_KEY" \
            "https://api.fugle.tw/marketdata/v1.0/stock/intraday/quote/2330"
