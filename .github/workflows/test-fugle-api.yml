name: 測試 Fugle 富果行情 API

# 僅手動觸發，驗證歷史 K 線 API 的正確呼叫方式與回應格式。
# 不印出 Key 明文，只印 HTTP 狀態碼與回應內容（公開報價資料，無隱私疑慮）。
# 驗證通過後這支 workflow 會被移除。

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 呼叫 Fugle 歷史 K 線 API
        env:
          FUGLE_API_KEY: ${{ secrets.FUGLE_API_KEY }}
        run: |
          if [ -z "$FUGLE_API_KEY" ]; then
            echo "❌ FUGLE_API_KEY 未設定，請先在 repo Secrets 新增"
            exit 1
          fi
          FROM=$(date -u -d '30 days ago' +%Y-%m-%d)
          TO=$(date -u +%Y-%m-%d)
          echo "=== 歷史 K 線 (日K, $FROM ~ $TO) ==="
          curl -sS -w "\nHTTP_STATUS:%{http_code}\n" \
            -H "X-API-KEY: $FUGLE_API_KEY" \
            "https://api.fugle.tw/marketdata/v1.0/stock/historical/candles/6498?from=$FROM&to=$TO"

          echo ""
          echo "=== 上櫃股即時報價 market 欄位 (6498) ==="
          curl -sS -w "\nHTTP_STATUS:%{http_code}\n" \
            -H "X-API-KEY: $FUGLE_API_KEY" \
            "https://api.fugle.tw/marketdata/v1.0/stock/intraday/quote/6498"
